      #     for i in $(seq 1 "$max_tries"); do
      #         if grep -q "${msg}" "${log}" 2>/dev/null; then
      #             echo "Waiting for \"$msg\" message in $log succeeded"
      #             exit 0
      #         fi
      #         echo "Waiting for \"$msg\" message in $log ... ($i/$max_tries)"
      #         sleep 1
      #     done
      #     echo "Error: Waiting for \"$msg\" message in $log timed out!"
      #     cat "${log}"
      #     exit 1

      - name: Checkout repository for integration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: integration-repo

      - name: Create or checkout integration branch
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="integration"
          echo "INTEGRATION_BRANCH=${BRANCH}" >> "${GITHUB_ENV}"

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Integration branch '${BRANCH}' already exists; checking out its state."
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            echo "Integration branch '${BRANCH}' does not exist; creating it from main."
            git checkout -B "${BRANCH}" origin/main
          fi

      - name: Replace working copy with upstream workspace
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${WORKSPACE_ROOT}" ]]; then
            echo "::error::WORKSPACE_ROOT '${WORKSPACE_ROOT}' does not exist."
            exit 1
          fi

          # Remove all tracked and untracked content except the repository metadata
          # and files that must remain in the integration repository. Add entries to
          # this list when additional repository-owned content should be preserved.
          preserve_paths=(
            '.git'
            '.github'
            '.gitignore'
            'CODE_OF_CONDUCT.md'
            'README.md'
          )

          while IFS= read -r -d '' path; do
            name="${path#./}"
            preserve=false
            for preserve_path in "${preserve_paths[@]}"; do
              if [[ "${name}" == "${preserve_path}" ]]; then
                preserve=true
                break
              fi
            done

            if [[ "${preserve}" != true ]]; then
              rm -rf -- "${path}"
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -print0)

          # Copy the upstream workspace on top, preserving flags, mtimes, ownership.
          # Ignore the "prebuilt" and "build" sub-folders.
          rsync -a --exclude='prebuilt' --exclude='build' "${WORKSPACE_ROOT}/." .

      - name: Commit integrated upstream content
        working-directory: integration-repo
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; working copy already matches upstream."
          else
            git commit -m "Integrate upstream version ${RELEASE_VERSION}"
          fi

          git push origin "HEAD:${INTEGRATION_BRANCH}"

      - name: Create or update integration pull request
        id: integration-pr
        working-directory: integration-repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --head "${INTEGRATION_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"

          if [[ -n "${existing_pr}" ]]; then
            echo "Pull request #${existing_pr} already exists for ${INTEGRATION_BRANCH} → main."
            echo "pr_number=${existing_pr}" >> "${GITHUB_OUTPUT}"
          else
            pr_url="$(gh pr create \
              --head "${INTEGRATION_BRANCH}" \
              --base main \
              --title "Integrate upstream version ${RELEASE_VERSION}" \
              --body "Automated PR created by the upstream integration workflow for release ${RELEASE_VERSION}.")"
            pr_number="$(echo "${pr_url}" | grep -oE '[0-9]+$')"
            echo "Created pull request #${pr_number}."
            echo "pr_tag=pr-${pr_number}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rewrite devcontainer image tag for PR
        id: rewrite-tag
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          devcontainer_json=".devcontainer/devcontainer.json"
          run_sh="./scripts/run.sh"
          rfi_tag="$(grep -oP '(?<="image":\s*".+:)[^"]+' "${devcontainer_json}")"

          if [[ -z "${rfi_tag}" ]]; then
            echo "::error::Could not extract image tag from ${devcontainer_json}."
            exit 1
          fi

          echo "Original tag: ${rfi_tag}"
          echo "rfi_tag=${rfi_tag}" >> "${GITHUB_OUTPUT}"

          new_tag="${{ steps.integration-pr.outputs.pr_tag }}"
          sed -i "s|:\${rfi_tag}\"|:${new_tag}\"|" "${devcontainer_json}"
          sed -i "s|:\${rfi_tag}\"|:${new_tag}\"|" "${run_sh}"
          echo "Rewrote image tag to: ${new_tag}"
          
          git add "${devcontainer_json}" "${run_sh}"
          git commit -am "Rewrite devcontainer image tag for PR"
          git push origin "HEAD:${INTEGRATION_BRANCH}"

      - name: Update container tags and push to registry
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          new_tag="${{ steps.integration-pr.outputs.pr_tag }}"
          docker tag "${DEVCONTAINER_IMAGE}:${{ steps.rewrite-tag.outputs.rfi_tag }}" "${DEVCONTAINER_IMAGE}:${new_tag}"
          docker tag "${BUILDCONTAINER_IMAGE}:${{ steps.rewrite-tag.outputs.rfi_tag }}" "${BUILDCONTAINER_IMAGE}:${new_tag}"

          echo "Pushing updated container images to registry..."
          docker push "${DEVCONTAINER_IMAGE}:${new_tag}"
          docker push "${BUILDCONTAINER_IMAGE}:${new_tag}"

      - name: Package assets
        shell: bash
        run: |
          set -euo pipefail

          command -v zip >/dev/null || { echo "::error::zip is required but not installed."; exit 1; }

          pdf_src="${EXTRACT_ROOT}/eb_corbos_toolkit/doc/user_manual.pdf"
          html_src="${EXTRACT_ROOT}/eb_corbos_toolkit/doc/html"
          prebuilt_src="${WORKSPACE_ROOT}/prebuilt"

          if [[ ! -f "${pdf_src}" ]]; then
            echo "::error::Expected user manual PDF not found at ${pdf_src}."
            exit 1
          fi

          if [[ ! -d "${html_src}" ]]; then
            echo "::error::Expected HTML user manual directory not found at ${html_src}."
            exit 1
          fi

          if [[ ! -d "${prebuilt_src}" ]]; then
            echo "::error::Expected prebuilt directory not found at ${prebuilt_src}."
            exit 1
          fi

          assets_dir="${TMP_WORK_DIR}/release-assets"
          mkdir -p "${assets_dir}"

          cp "${pdf_src}" "${assets_dir}/user_manual.pdf"
          ( cd "${html_src}" && zip -r "${assets_dir}/user_manual_html.zip" . )
          ( cd "${prebuilt_src}" && zip -r "${assets_dir}/prebuilt.zip" . )

          echo "RELEASE_ASSETS_DIR=${assets_dir}" >> "${GITHUB_ENV}"

      - name: Create or update draft release
        working-directory: integration-repo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          pdf_asset="${RELEASE_ASSETS_DIR}/user_manual.pdf"
          html_asset="${RELEASE_ASSETS_DIR}/user_manual_html.zip"
          prebuilt_asset="${RELEASE_ASSETS_DIR}/prebuilt.zip"

          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_VERSION}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release '${RELEASE_VERSION}' already exists and is published (not a draft); refusing to modify it."
              exit 1
            fi
            echo "Draft release '${RELEASE_VERSION}' already exists; updating assets."
            gh release upload "${RELEASE_VERSION}" "${pdf_asset}" "${html_asset}" "${prebuilt_asset}" --clobber
          else
            echo "Creating draft release '${RELEASE_VERSION}'."
            # A draft release with a not-yet-existing tag does not create the tag
            # or point at any commit/branch until it is published.
            gh release create "${RELEASE_VERSION}" \
              --draft \
              --title "${RELEASE_VERSION}" \
              "${pdf_asset}" "${html_asset}" "${prebuilt_asset}"
          fi
