name: Update Toolkit from Internal Release Archive

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "URL for the toolkit tar.gz archive"
        required: true
        type: string
      artifactory_token:
        description: "Authentication bearer token"
        required: true
        type: string
      release_version:
        description: "Release version string (e.g. v2.0.0-beta2)"
        required: true
        type: string

permissions:
  contents: write   # create the tag + Release, upload assets

jobs:
  build-from-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Authorize triggering actor
        env:
          ALLOWED_ACTORS: ${{ vars.WORKFLOW_ALLOWED_ACTORS }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ALLOWED_ACTORS:-}" ]]; then
            echo "::error::Repository variable WORKFLOW_ALLOWED_ACTORS is not set."
            echo "::error::Set it to a comma-separated list of GitHub usernames allowed to run this workflow."
            exit 1
          fi

          normalized="${ALLOWED_ACTORS// /}"
          if [[ ",${normalized}," != *",${GITHUB_ACTOR},"* ]]; then
            echo "::error::Actor is not authorized to run this workflow."
            exit 1
          fi

          echo "Actor authorization succeeded."

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v tar >/dev/null
          command -v docker >/dev/null
          command -v jq >/dev/null

      - name: Download and unpack archive
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_URL="$(jq -r '.inputs.artifact_url // empty' "${GITHUB_EVENT_PATH}")"
          ARTIFACTORY_TOKEN="$(jq -r '.inputs.artifactory_token // empty' "${GITHUB_EVENT_PATH}")"

          if [[ -z "${ARTIFACTORY_TOKEN:-}" ]]; then
            echo "::error::Required workflow input artifactory_token is not set."
            exit 1
          fi

          if [[ -z "${ARTIFACT_URL:-}" ]]; then
            echo "::error::Required workflow input artifact_url is not set."
            exit 1
          fi

          # Treat the manual input URL as sensitive operational data.
          echo "::add-mask::${ARTIFACT_URL}"
          echo "::add-mask::${ARTIFACTORY_TOKEN}"

          tmp_dir="$(mktemp -d)"
          archive_path="${tmp_dir}/toolkit.tar.gz"
          extract_root="${tmp_dir}/extracted"

          mkdir -p "${extract_root}"

          echo "Starting archive download (this may take a while for large files)..."
          echo "Download target: ${archive_path}"

          curl \
            --fail \
            --progress-bar \
            --show-error \
            --location \
            --header "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
            --output "${archive_path}" \
            --url "${ARTIFACT_URL}"

          archive_size_bytes="$(wc -c < "${archive_path}")"
          archive_size_mib="$(awk "BEGIN { printf \"%.2f\", ${archive_size_bytes}/1024/1024 }")"
          echo "Download complete: ${archive_size_bytes} bytes (${archive_size_mib} MiB)."

          echo "Starting archive extraction into ${extract_root}..."

          tar -xzf "${archive_path}" -C "${extract_root}"

          echo "Extraction complete."

          cat >> "${GITHUB_ENV}" << EOF
          TMP_WORK_DIR=${tmp_dir}
          EXTRACT_ROOT=${extract_root}
          WORKSPACE_ROOT=${extract_root}/eb_corbos_toolkit/workspace
          IMAGE_ARCHIVE=${extract_root}/eb_corbos_toolkit/containers/devcontainer-trixie-ebclfsa-amd64.docker-archive.zst
          RUN_SCRIPT=${extract_root}/eb_corbos_toolkit/workspace/scripts/run.sh
          BITBAKE_EXECUTION_FIXER=${extract_root}/eb_corbos_toolkit/workspace/.devcontainer/scripts/check_userns_restriction.sh
          EOF

      - name: Validate extracted layout
        shell: bash
        run: |
          if [[ ! -f "${IMAGE_ARCHIVE}" ]]; then
            echo "::error::Expected container archive path not found in extracted payload."
            exit 1
          fi

          if [[ ! -f "${RUN_SCRIPT}" ]]; then
            echo "::error::Expected eb_corbos_toolkit/workspace/scripts/run.sh not found in extracted payload."
            exit 1
          fi

          chmod +x "${RUN_SCRIPT}"

      - name: Load container image
        shell: bash
        run: |
          docker load -i "${IMAGE_ARCHIVE}"

      - name: "Fix BitBake execution issue on Ubuntu 23.10+"
        shell: bash
        run: |
          "${{ env.BITBAKE_EXECUTION_FIXER }}" --yes

      - name: Run kas build from extracted run.sh
        shell: bash
        working-directory: ${{ env.WORKSPACE_ROOT }}
        run: |
          "${RUN_SCRIPT}" -d -- kas build --target fastdev kas/public.yml

      - name: Test the fastdev image in qemu
        shell: bash
        working-directory: ${{ env.WORKSPACE_ROOT }}
        run: |
          # run dev container in detached mode and keep it running
          export EXTRA_DOCKER_OPTIONS="-d --log-driver local"
          LOG_FILE=$(mktemp -t ebcl_run_devcontainer-XXXXXX.log 2>/dev/null) || \
            LOG_FILE="/tmp/ebcl_run_devcontainer.log"

          echo "Starting devcontainer in the background"
          DEV_CONTAINER_ID=$("${RUN_SCRIPT}" -d -- bash -c "sleep infinity" 2>&1 | tee "$LOG_FILE" | grep -oE '^[0-9a-f]{64}$')
          if [[ -z "${DEV_CONTAINER_ID}" ]]; then
              echo "::error::Failed to start devcontainer. Log output:"
              cat "$LOG_FILE"
              exit 1
          fi
          sleep 10

          devcontainer_exec()
          {
              docker exec "$DEV_CONTAINER_ID" "$@"
          }

          echo "Running fastdev in qemu in background, logging to qemu.log"
          devcontainer_exec bash -c "./scripts/qemu.sh -t fastdev < /dev/null > qemu.log 2>&1 &"
          devcontainer_exec bash -c \
            "log=/workspace/qemu.log; source /workspace/scripts/includes/common/common.inc; wait_for_ssh fastdev-qemuarm64 70 1"

          echo "Terminating fastdev"
          devcontainer_exec ssh fastdev-qemuarm64 crinit-ctl poweroff || true

          echo "Waiting for fastdev to power down"
          max_tries=20
          msg="Power down"
          log="$WORKSPACE_ROOT/qemu.log"

          for i in $(seq 1 "$max_tries"); do
              if grep -q "${msg}" "${log}" 2>/dev/null; then
                  echo "Waiting for \"$msg\" message in $log succeeded"
                  exit 0
              fi
              echo "Waiting for \"$msg\" message in $log ... ($i/$max_tries)"
              sleep 1
          done
          echo "Error: Waiting for \"$msg\" message in $log timed out!"
          cat "${log}"
          exit 1

      - name: Remove prebuilt assets from workspace before branch update
        shell: bash
        run: |
          rm -rf "${{ env.WORKSPACE_ROOT }}/prebuilt"
          rm -rf "${{ env.WORKSPACE_ROOT }}/build"

      - name: Checkout repository for integration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          path: integration-repo

      - name: Create or checkout integration branch
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="integration"
          echo "INTEGRATION_BRANCH=${BRANCH}" >> "${GITHUB_ENV}"

          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Integration branch '${BRANCH}' already exists; checking out its state."
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            echo "Integration branch '${BRANCH}' does not exist; creating it from main."
            git checkout -B "${BRANCH}" origin/main
          fi

      - name: Replace working copy with upstream workspace
        working-directory: integration-repo
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${WORKSPACE_ROOT}" ]]; then
            echo "::error::WORKSPACE_ROOT '${WORKSPACE_ROOT}' does not exist."
            exit 1
          fi

          # Remove all tracked and untracked content except the .git folder.
          find . -mindepth 1 -maxdepth 1 -name '.git' -prune -o -exec rm -rf {} +

          # Copy the upstream workspace on top, preserving flags, mtimes, ownership.
          cp -a "${WORKSPACE_ROOT}/." .

      - name: Commit integrated upstream content
        working-directory: integration-repo
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; working copy already matches upstream."
          else
            git commit -m "Integrate upstream version ${RELEASE_VERSION}"
          fi

          git push origin "HEAD:${INTEGRATION_BRANCH}"

      - name: Package user manual assets
        shell: bash
        run: |
          set -euo pipefail

          command -v zip >/dev/null || { echo "::error::zip is required but not installed."; exit 1; }

          pdf_src="${EXTRACT_ROOT}/doc/user_manual.pdf"
          html_src="${EXTRACT_ROOT}/doc/html"

          if [[ ! -f "${pdf_src}" ]]; then
            echo "::error::Expected user manual PDF not found at ${pdf_src}."
            exit 1
          fi

          if [[ ! -d "${html_src}" ]]; then
            echo "::error::Expected HTML user manual directory not found at ${html_src}."
            exit 1
          fi

          assets_dir="${TMP_WORK_DIR}/release-assets"
          mkdir -p "${assets_dir}"

          cp "${pdf_src}" "${assets_dir}/user_manual.pdf"
          ( cd "${html_src}" && zip -r "${assets_dir}/user_manual_html.zip" . )

          echo "RELEASE_ASSETS_DIR=${assets_dir}" >> "${GITHUB_ENV}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          pdf_asset="${RELEASE_ASSETS_DIR}/user_manual.pdf"
          html_asset="${RELEASE_ASSETS_DIR}/user_manual_html.zip"

          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_VERSION}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release '${RELEASE_VERSION}' already exists and is published (not a draft); refusing to modify it."
              exit 1
            fi
            echo "Draft release '${RELEASE_VERSION}' already exists; updating assets."
            gh release upload "${RELEASE_VERSION}" "${pdf_asset}" "${html_asset}" --clobber
          else
            echo "Creating draft release '${RELEASE_VERSION}'."
            # A draft release with a not-yet-existing tag does not create the tag
            # or point at any commit/branch until it is published.
            gh release create "${RELEASE_VERSION}" \
              --draft \
              --title "${RELEASE_VERSION}" \
              "${pdf_asset}" "${html_asset}"
          fi
