name: Execute Release Activities

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.0.0-beta2)"
        required: true
        type: string

# Only one release should run at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read      # read the release + download its assets
  pages: write        # publish to GitHub Pages
  id-token: write     # required by the Pages deployment

env:
  USER_GUIDE_ASSET: user_manual_html.tar.gz
  # Tag from the manual input when dispatched, otherwise the pushed tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  execute-release-activities:
    name: Execute Release Activities
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null
          command -v tar >/dev/null

      - name: Verify published release contains the User's Manual asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          echo "Checking release for tag '${tag}'."

          if ! release_json="$(gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets 2>/dev/null)"; then
            echo "::error::No release is associated with tag '${tag}'."
            exit 1
          fi

          has_asset="$(jq -r --arg a "${USER_GUIDE_ASSET}" \
            '[.assets[].name] | index($a) != null' <<<"${release_json}")"
          if [[ "${has_asset}" != "true" ]]; then
            echo "::error::Published release for tag '${tag}' does not contain asset '${USER_GUIDE_ASSET}'."
            exit 1
          fi

          echo "Published release for tag '${tag}' contains '${USER_GUIDE_ASSET}'."

      - name: Download and extract the User's Manual asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          tmp_dir="$(mktemp -d)"

          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${USER_GUIDE_ASSET}" \
            --dir "${tmp_dir}"

          rm -rf _site
          mkdir -p _site
          tar -xzf "${tmp_dir}/${USER_GUIDE_ASSET}" -C _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy User's Manual to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
