# SSH config entries for public reference images

Host fastdev-qemuarm64
    HostName fastdev-qemuarm64
    Port 10022
    User root
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    # Keys from prebuilt images
    IdentityFile /workspace/prebuilt/fastdev/ssh_keys/fastdev-trixie-ebclfsa-ebcl-qemuarm64-ssh-target-key
    # Autogenerated keys for locally built images
    IdentityFile /workspace/build/tmp/deploy/images/ebcl-qemuarm64/fastdev-trixie-ebclfsa-ebcl-qemuarm64-ssh-target-key
    # Manually injected keys for shared images
    IdentityFile /workspace/.ssh_keys/fastdev-trixie-ebclfsa-ebcl-qemuarm64-ssh-target-key

Host fastdev-rpi4b
    HostName fastdev-rpi4b
    Port 22
    User root
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    # Keys from prebuilt images
    IdentityFile /workspace/prebuilt/fastdev-rpi4b/ssh_keys/fastdev-trixie-ebclfsa-rpi4b-ssh-target-key
    # Autogenerated keys for locally built images
    IdentityFile /workspace/build/tmp/deploy/images/rpi4b/fastdev-trixie-ebclfsa-rpi4b-ssh-target-key
    # Manually injected keys for shared images
    IdentityFile /workspace/.ssh_keys/fastdev-trixie-ebclfsa-rpi4b-ssh-target-key
