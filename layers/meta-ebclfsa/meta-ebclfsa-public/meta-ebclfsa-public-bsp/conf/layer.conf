# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Uncomment this if recipes are added to this layer
# BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
#             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ebclfsa-public-bsp"
BBFILE_PATTERN_meta-ebclfsa-public-bsp = "^${LAYERDIR}/"
# Once this layer provides bb files, the following line can be removed
BBFILE_PATTERN_IGNORE_EMPTY_meta-ebclfsa-public-bsp = "1"
BBFILE_PRIORITY_meta-ebclfsa-public-bsp = "7"

LAYERDEPENDS_meta-ebclfsa-public-bsp = "meta-ebclfsa-public"
LAYERSERIES_COMPAT_meta-ebclfsa-public-bsp = "v0.6"
