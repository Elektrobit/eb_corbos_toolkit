# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ebclfsa-public"
BBFILE_PATTERN_meta-ebclfsa-public = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ebclfsa-public = "6"

LAYERDEPENDS_meta-ebclfsa-public = "meta-ebclfsa meta-generated-public"
LAYERSERIES_COMPAT_meta-ebclfsa-public = "v0.6"

LAYERDIR_meta-ebclfsa-public = "${LAYERDIR}"

# Globally fix the empty SSTATE_PKGARCH of -native variants so their sstate
# objects can be restored from cache (see classes/native_sstate_pkgarch.bbclass).
INHERIT += "native_sstate_pkgarch"
