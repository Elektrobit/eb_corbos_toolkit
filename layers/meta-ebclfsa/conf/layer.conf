# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Uncomment this if recipes are added to this layer
# BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
#             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ebclfsa"
BBFILE_PATTERN_meta-ebclfsa = "^${LAYERDIR}/"
# Once this layer provides bb files, the following line can be removed
BBFILE_PATTERN_IGNORE_EMPTY_meta-ebclfsa = "1"
BBFILE_PRIORITY_meta-ebclfsa = "6"

LAYERDEPENDS_meta-ebclfsa = "core"
LAYERSERIES_COMPAT_meta-ebclfsa = "v0.6"
