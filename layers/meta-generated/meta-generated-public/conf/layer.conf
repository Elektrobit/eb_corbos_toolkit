# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "meta-generated-public"
BBFILE_PATTERN_meta-generated-public = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-generated-public = "6"

LAYERDEPENDS_meta-generated-public = "core meta-generated"
LAYERSERIES_COMPAT_meta-generated-public = "v0.6"

# python3-jinja2 is required during certain sbuild dependency installations on
# amd64. Version 2.1.5-1+b4 currently exists only for arm64 in generated
# metadata, while 2.1.5-1+b3 provides amd64. Hence, we prefer the version that provides amd64.
PREFERRED_VERSION_python3-markupsafe = "2.1.5-1+b3"

# python3-msgpack is required during certain sbuild dependency installations on
# amd64. Version 1.0.3-3+b5 currently exists only for arm64 in generated metadata,
# while 1.0.3-3+b4 provides amd64. Hence, we prefer the version that provides amd64.
PREFERRED_VERSION_python3-msgpack = "1.0.3-3+b4"

# bc is required during certain sbuild dependency installations on
# amd64. Version 1.07.1-4+b1 currently exists only for arm64 in generated metadata,
# while 1.07.1-4 provides amd64. Hence, we prefer the version that provides amd64.
PREFERRED_VERSION_bc = "1.07.1-4"
