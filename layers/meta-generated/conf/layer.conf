# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Uncomment this if recipes are added to this layer
# BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
#             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-generated"
BBFILE_PATTERN_meta-generated = "^${LAYERDIR}/"
# Once this layer provides bb files, the following line can be removed
BBFILE_PATTERN_IGNORE_EMPTY_meta-generated = "1"
BBFILE_PRIORITY_meta-generated = "6"

LAYERDEPENDS_meta-generated = "core"
LAYERSERIES_COMPAT_meta-generated = "v0.6"

# The repository base URLs are the only variable part of the generated SRC_URIs
# and are rewritten per CI run, while the artifacts stay pinned by checksum.
# Keeping them out of the task signatures preserves sstate reuse.
# Must use :append, as layer.conf is parsed before bitbake.conf sets the default.
BB_BASEHASH_IGNORE_VARS:append = " \
    REPO_EBCLFSA_CORE \
    REPO_EBCLFSA_INTERNAL \
    REPO_EBCLFSA_PUBLIC \
    REPO_EBCLFSA_PUBLIC_BINARY \
    REPO_THIRD_PARTY_REBUILT_BY_ELEKTROBIT \
"
