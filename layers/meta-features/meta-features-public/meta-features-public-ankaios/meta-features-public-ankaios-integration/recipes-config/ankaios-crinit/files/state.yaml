apiVersion: v1
workloads:
  diagnostic_ankaios_dashboard:
    runtime: podman
    agent: agent_A
    restart: true
    controlInterfaceAccess:
      allowRules:
        - type: StateRule
          operation: ReadWrite
          filterMasks:
            - "*"
    restartPolicy: NEVER
    runtimeConfig: |
      image: ghcr.io/windsource/ankaios-dashboard:1.0.0
      commandOptions: ["--net=host", "-e", "PASSWORD=admin"]
  core_databroker:
    runtime: podman
    agent: agent_A
    runtimeConfig: |
      image: ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.0
      commandArgs: ["--insecure"]
      commandOptions: ["--net=host"]
  core_speed-provider:
    runtime: podman
    agent: agent_A
    runtimeConfig: |
      image: ghcr.io/eclipse-ankaios/speed-provider:0.1.3
      commandOptions:
        - "--net=host"
        - "-e"
        - "SPEED_PROVIDER_MODE=auto"
  thirdparty_speed-consumer:
    runtime: podman
    agent: agent_A
    runtimeConfig: |
      image: ghcr.io/eclipse-ankaios/speed-consumer:0.1.2
      commandOptions:
        - "--net=host"
        - "-e"
        - "KUKSA_DATA_BROKER_ADDR=127.0.0.1"
