header:
  version: 18

repos:
  isar:
    path: "layers/isar"
    url: "git@github.com:ilbers/isar.git"
    commit: "cc5a5d98a89ca19049575b94b71a0beeafa61c71"
    branch:
    layers:
      meta:
      meta-isar:
      meta-test:
    patches:
      bootstrap-from-local-isar-apt:
        repo: isar
        path: "../../kas/patches/public/isar/bootstrap-from-local-isar-apt"
      multiarch-fixes:
        repo: isar
        path: "../../kas/patches/public/isar/multiarch-fixes"
      fix-premirrors:
        repo: isar
        path: "../../kas/patches/public/isar/fix-premirrors"
      sdk-relocation:
        repo: isar
        path: "../../kas/patches/public/isar/sdk-relocation"
      fix-buildstats:
        repo: isar
        path: "../../kas/patches/public/isar/fix-buildstats"
      sbom-python-fixes:
        repo: isar
        path: "../../kas/patches/public/isar/sbom-python-fixes"
      fix-symlink-race-condition:
        repo: isar
        path: "../../kas/patches/public/isar/fix-symlink-race-condition"
      fix-isar-apt-pool-race:
        repo: isar
        path: "../../kas/patches/public/isar/fix-isar-apt-pool-race"
      fix-container-reproducibility:
        repo: isar
        path: "../../kas/patches/public/isar/fix-container-reproducibility"
      fix-sstate-workdir-removal:
        repo: isar
        path: "../../kas/patches/public/isar/fix-sstate-workdir-removal"
      gitignore:
        repo: isar
        path: "../../kas/patches/public/isar/gitignore"
      reproducible-builds:
        repo: isar
        path: "../../kas/patches/public/isar/reproducible-builds"

local_conf_header:
  kernel: |
    # Disable ISAR kernel package
    BBMASK:append = " layers/isar/meta/recipes-kernel/linux/linux-distro.bb"
    # Disable ISAR BSP packages
    BBMASK:append = " layers/isar/meta/recipes-bsp/.*\.bb"
  ccache: |
    USE_CCACHE = "1"
