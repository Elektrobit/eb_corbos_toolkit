header:
  version: 18

repos:
  meta-features-public-ankaios-integration:
    path: "layers/meta-features/meta-features-public/meta-features-public-ankaios/meta-features-public-ankaios-integration"
    layers:
      .:
  meta-features-public-ankaios-packages:
    path: "layers/meta-features/meta-features-public/meta-features-public-ankaios/meta-features-public-ankaios-packages"
    layers:
      .:

local_conf_header:
  ankaios_feature: |
    ANKAIOS_FEATURE_EXAMPLE_INTEGRATION = " \
        ank-server \
        ank-agent \
        ank \
        crun \
        podman \
        skopeo \
        ankaios-crinit \
        ankaios-images \
    "

    ANKAIOS_FEATURE_EXAMPLE_INTEGRATION_SIZE_MB = "2048"

    # Additional feature content
    EBCLFSA_FASTDEV_FEATURES_CONTENT += "${ANKAIOS_FEATURE_EXAMPLE_INTEGRATION}"
    EBCLFSA_LIVM_FEATURES_CONTENT += "${ANKAIOS_FEATURE_EXAMPLE_INTEGRATION}"
    # Currently nothing for EBCLFSA_HIVM_FEATURES_CONTENT
    # Currently nothing for EBCLFSA_FASTDEV_FEATURE_SDK_CONTENT
    # Currently nothing for EBCLFSA_LIVM_FEATURE_SDK_CONTENT
    # Currently nothing for EBCLFSA_HIVM_FEATURE_SDK_CONTENT

    # Partition growth settings for different rootfs types in Megabytes
    EBCLFSA_FASTDEV_FEATURES_ROOTFS_PARTITION_GROWTH_MB += " ${ANKAIOS_FEATURE_EXAMPLE_INTEGRATION_SIZE_MB}"
    EBCLFSA_LIVM_FEATURES_ROOTFS_PARTITION_GROWTH_MB += " ${ANKAIOS_FEATURE_EXAMPLE_INTEGRATION_SIZE_MB}"
    # Currently nothing for EBCLFSA_HIVM_FEATURES_ROOTFS_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_FASTDEV_FEATURES_DATA_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_LIVM_FEATURES_DATA_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_HIVM_FEATURES_DATA_PARTITION_GROWTH_MB
