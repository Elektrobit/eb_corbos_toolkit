header:
  version: 18
  includes:
    - kas/features/public/graphics.yml

local_conf_header:
  compositor_feature: |
    COMPOSITOR_FEATURE_EXAMPLE_INTEGRATION = " \
      weston \
      xwayland \
      udev \
      ebclfsa-base-crinit-weston \
    "

    COMPOSITOR_FEATURE_EXAMPLE_INTEGRATION_SIZE_MB = "128"

    # Additional feature content
    EBCLFSA_FASTDEV_FEATURES_CONTENT += "${COMPOSITOR_FEATURE_EXAMPLE_INTEGRATION}"
    # Currently nothing for EBCLFSA_LIVM_FEATURES_CONTENT
    # Currently nothing for EBCLFSA_HIVM_FEATURES_CONTENT
    # Currently nothing for EBCLFSA_FASTDEV_FEATURE_SDK_CONTENT
    # Currently nothing for EBCLFSA_LIVM_FEATURE_SDK_CONTENT
    # Currently nothing for EBCLFSA_HIVM_FEATURE_SDK_CONTENT

    # Partition growth settings for different rootfs types in Megabytes
    EBCLFSA_FASTDEV_FEATURES_ROOTFS_PARTITION_GROWTH_MB += " ${COMPOSITOR_FEATURE_EXAMPLE_INTEGRATION_SIZE_MB}"
    # Currently nothing for EBCLFSA_LIVM_FEATURES_ROOTFS_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_HIVM_FEATURES_ROOTFS_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_FASTDEV_FEATURES_DATA_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_LIVM_FEATURES_DATA_PARTITION_GROWTH_MB
    # Currently nothing for EBCLFSA_HIVM_FEATURES_DATA_PARTITION_GROWTH_MB
